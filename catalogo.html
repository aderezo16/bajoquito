<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bajo Quito · Catálogo de modelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="cat">
    <aside id="side">
      <div class="brand"><b>Bajo Quito</b><span>Catálogo de modelos</span></div>
      <nav id="list"></nav>
      <div class="legend"><span class="st ok">aprobado</span> lo usa el juego · <span class="st rev">en revisión</span> solo aquí</div>
    </aside>
    <main id="stage">
      <canvas id="view"></canvas>
      <div id="bar">
        <div class="seg" id="light"><button data-l="day">Día</button><button data-l="night" class="on">Noche</button></div>
        <button class="tg on" id="spin">Girar</button>
        <button class="tg" id="scale">Persona de escala</button>
        <button class="tg" id="compare" hidden>Comparar con la aprobada</button>
        <button class="tg" id="all" hidden>Ver los tres juntos</button>
      </div>
      <section id="info">
        <div class="head"><h1 id="name"></h1><span id="status" class="st"></span></div>
        <div id="versions"></div>
        <div class="meta" id="meta"></div>
        <p id="notes"></p>
        <div class="ask">Para pedir un cambio, dime el nombre y qué quieres: <i>«<span id="askname"></span>: …»</i></div>
      </section>
      <div id="tags"></div>
      <div id="help">Arrastra para girar · rueda para acercar · clic derecho para mover</div>
    </main>
  </div>
  <script type="module" src="/src/catalog/main.ts"></script>
</body>
</html>
