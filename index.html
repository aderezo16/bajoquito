<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bajo Quito · prueba 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="pins"></div>
    <header id="top">
      <div class="brand"><b>Bajo Quito</b><span>Prueba 3D · tramo Centro</span></div>
      <div id="views" role="tablist">
        <button class="vbtn on" data-view="sup" role="tab">
          <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg>Superficie</button>
        <button class="vbtn" data-view="sub" role="tab">
          <svg viewBox="0 0 24 24"><path d="M4 14h16M6 14v5M18 14v5M8 10l4-6 4 6M12 4v10"/></svg>Bajo tierra</button>
      </div>
      <div class="fps" id="fps">— fps</div>
    </header>
    <div id="strip"></div>
    <div id="zoom">
      <button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button>
      <div id="zlev"><span></span><span></span><span></span></div>
    </div>
    <div id="hint">Arrastra para recorrer · rueda o pellizco para acercar · pasa el mouse sobre un edificio</div>
    <div id="toast"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
